server {
    listen 80;
    server_name water-calculator;

    # Directory where Vite will generate the build (dist)
    root /usr/share/nginx/html;
    index index.html index.htm;

    # GZIP compression options (optional but recommended)
    gzip on;
    gzip_vary on;
    gzip_min_length 10240;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml application/javascript;
    gzip_disable "MSIE [1-6]\.";

    # Configuration for React Router to work (Single Page Application)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Reverse Proxy to the backend container
    location /api/ {
        # "backend" will be the service name in docker-compose and 3000 the internally exposed port
        proxy_pass http://backend:3000;
        
        # Useful headers for the backend (real IP, host, etc)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}
