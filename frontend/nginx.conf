# HTTP — redirect to HTTPS + certbot challenge
server {
    listen 80;
    server_name water-calculator.space www.water-calculator.space;

    # Allow Let's Encrypt ACME challenge (certbot webroot)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS
server {
    listen 443 ssl;
    server_name water-calculator.space www.water-calculator.space;

    ssl_certificate /etc/letsencrypt/live/water-calculator.space/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/water-calculator.space/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Directory where Vite will generate the build (dist)
    root /usr/share/nginx/html;
    index index.html index.htm;

    # GZIP compression options
    gzip on;
    gzip_vary on;
    gzip_min_length 10240;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml application/javascript;
    gzip_disable "MSIE [1-6]\.";

    # Configuration for React Router to work (Single Page Application)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets generated by Vite
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # Reverse Proxy to the backend container
    location /api/ {
        proxy_pass http://backend:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}
